global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong-dp:8100"]

  # Module 7 — metrics Kong ships via the opentelemetry plugin, re-exposed
  # in Prometheus format by the otel-collector. Only scrapable if the otel
  # stack (docker-compose.otel.yml) is running.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
