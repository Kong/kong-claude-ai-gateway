        model:
          body:
            model:
            - claude-fable-5
      model:
        name_header: true
    targets:
    - name: claude-fable-5
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
        # No pricing precedent for this model anywhere in this repo (unlike
        # Opus/Sonnet/Haiku, which mirror 4-rate-limiting-policy.yaml's
        # tiers) — priced provisionally at Opus-tier as a pure guess. Replace
        # with real Anthropic pricing before this feeds any real budget.
        input_cost: 15    # USD / million input tokens — placeholder, replace with current pricing
        output_cost: 75   # USD / million output tokens — placeholder, replace with current pricing

  - ref: claude-opus-4-7
    type: model
