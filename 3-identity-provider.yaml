# Step 4 — SSO with OIDC (Okta in this example).
#
# (Numbered 3 because Step 2, the vault, has no kongctl resource of its
# own — see scripts/bootstrap-vault.sh.)
#
# Adds an OIDC auth strategy that requires a valid Okta-issued bearer token.
# Every model below carries `access.auth_strategies: [okta-groups-idp]`, and
# so does the `anthropic-models-endpoint` agent, so both inference and
# model discovery need a token. The `team` claim (values `kong-premium` /
# `kong-standard`) maps onto the consumer_groups below via
# `consumer_groups_claim`.
#
# `consumer_optional: true` means "authenticate with the IdP even with no
# matching Consumer record" — this repo never creates per-user Consumers,
# so group membership, not individual identity, is what
# 6-rate-limiting-policy.yaml keys budgets on.
#
# This file re-declares the FULL model set from 2-claude-integration.yaml
# (each file is the full desired state up to that step); only the `access`
# block is new per model.
#
# Swap in your own IdP by pointing the vault secrets at your provider's
# issuer / client id / secret and changing the group claim name to match
# your token shape — nothing else in this file is Okta-specific.
#
# Preview: kongctl diff -f 3-identity-provider.yaml
# Apply:   kongctl apply -f 3-identity-provider.yaml

_defaults:
  kongctl:
    namespace: kong-app-gateway-claude

ai_gateways:
- ref: claude-tiered-gateway
  name: claude-tiered-gateway
  display_name: "Claude Gateway"
  description: "Kong AI Gateway control plane fronting Claude for the kong-app-gateway-claude example"
  labels:
    repo: kong-app-gateway-claude
    example: tiered-model-entitlement

  auth_strategies:
  - ref: okta-groups-idp
    name: okta-groups-idp
    display_name: "Okta OIDC"
    type: openid-connect
    config:
      issuer: "{vault://claude-gateway-vault/okta-issuer}"
      client_id:
      - "{vault://claude-gateway-vault/okta-client-id}"
      client_secret:
      - "{vault://claude-gateway-vault/okta-client-secret}"
      cache_tokens_salt: "{vault://claude-gateway-vault/oidc-cache-tokens-salt}"
      # bearer validates an access token sent by a client; authorization_code
      # supports the interactive sign-in flow (Konnect UI test, Claude Desktop).
      auth_methods:
      - bearer
      - authorization_code
      scopes:
      - openid
      # Maps the Okta `team` claim (kong-premium / kong-standard) onto the
      # consumer_groups below, which the spend limits key on.
      consumer_groups_claim:
      - team
      consumer_optional: true
      ssl_verify: true

  consumer_groups:
  - ref: tier-premium
    name: kong-premium
  - ref: tier-standard
    name: kong-standard

  model_providers:
  - ref: anthropic-direct
    name: anthropic-direct
    display_name: "Anthropic (direct key)"
    type: anthropic
    config:
      auth:
        type: basic
        headers:
        - name: x-api-key
          value: "{vault://claude-gateway-vault/anthropic-api-key}"

  policies:
  # `add` alone only sets the header if the incoming request doesn't
  # already carry one with this name — a caller could send their own
  # x-api-key and `add` would silently leave it in place, forwarding the
  # wrong (or no) key upstream. `add` + `replace` on the same header
  # covers both cases: `add` sets it when absent, `replace` overwrites it
  # when the caller already sent one, so the vault-sourced key always wins.
  - ref: anthropic-add-key
    name: anthropic-add-key
    display_name: "anthropic-add-key"
    type: request-transformer-advanced
    enabled: true
    global: false
    config:
      add:
        headers:
        - "{vault://claude-gateway-vault/anthropic-api-key-header}"
      replace:
        headers:
        - "{vault://claude-gateway-vault/anthropic-api-key-header}"

  agents:
  - ref: anthropic-models-endpoint
    name: anthropic-models-endpoint
    display_name: "Anthropic models endpoint"
    type: http
    enabled: true
    access:
      auth_strategies:
      - okta-groups-idp
    config:
      url: https://api.anthropic.com/v1/models
      route:
        paths:
        - /anthropic/v1/models
        protocols:
        - http
        - https
      logging:
        payloads: false
      max_request_body_size: 8388608
    policies:
    - anthropic-add-key

  models:
  - ref: claude
    type: model
    name: claude
    display_name: "Claude"
    enabled: true
    formats:
    - type: anthropic
    capabilities:
    - generate
    access:
      auth_strategies:
      - okta-groups-idp
    config:
      route:
        paths:
        - /anthropic
        protocols:
        - http
        - https
        model:
          body_param: model
          values:
            - claude-sonnet-4-5
      model:
        name_header: true
    targets:
    - name: claude-sonnet-5
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
        input_cost: 5    # USD / million input tokens — placeholder, replace with current pricing
        output_cost: 15   # USD / million output tokens — placeholder, replace with current pricing

  - ref: claude-sonnet-5
    type: model
    name: claude-sonnet-5
    display_name: "Claude Sonnet 5"
    enabled: true
    formats:
    - type: anthropic
    capabilities:
    - generate
    access:
      auth_strategies:
