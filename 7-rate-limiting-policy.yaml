  # NEW — the actual rate-limiting policy this file adds. Applied to
  # every model below (`policies: [tiered-cost-budget]`), not globally —
  # spend is metered on chat completions, not on the model-listing
  # mcp_servers above.
  - ref: tiered-cost-budget
    name: tiered-cost-budget
    display_name: "Per-group cost budget"
    type: ai-rate-limiting-advanced
    enabled: true
    global: false
    config:
      identifier: consumer-group
      strategy: local     # per-DP counters; N data planes = N x limit.
                           # switch to redis (host+port) for a shared,
                           # multi-DP-accurate budget.
      policies:
      - match:
        - type: consumer_group
          values: [kong-premium]
        window_type: sliding
        limits:
        - limit: 5.0        # USD per window, not tokens
          window_size: 60
          tokens_count_strategy: cost
      - match:
        - type: consumer_group
          values: [kong-standard]
        window_type: sliding
        limits:
        - limit: 1.0
          window_size: 60
          tokens_count_strategy: cost

  mcp_servers:
  - ref: anthropic-models-endpoint
    name: anthropic-models-endpoint
    display_name: "anthropic-models endpoint"
    type: passthrough-listener
    enabled: true
    access:
      acl_attribute_type: consumer
    config:
      url: https://api.anthropic.com/v1/models
      route:
        paths:
        - /anthropic/v1/models
        protocols:
        - http
        - https
      logging:
        payloads: false
        audits: false
      server:
        forward_client_headers: false
        timeout: 10000
      max_request_body_size: 8388608
    policies:
    - anthropic-add-key

  - ref: claude-models-premium
    name: claude-models-premium
    display_name: "Claude models (premium team)"
    type: passthrough-listener
    enabled: true
    access:
      acl_attribute_type: consumer
    config:
      url: https://api.anthropic.com/v1/models
      route:
