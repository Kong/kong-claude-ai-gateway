        headers:
          Team:
          - kong-standard
        protocols:
        - http
        - https
    policies:
    - claude-models-standard-list

  models:
  - ref: claude
    type: model
    name: claude
    display_name: "Claude"
    enabled: true
    formats:
    - type: anthropic
    capabilities:
    - generate
    access:
      identity_providers:
      - okta-groups-idp
    policies:
    - tiered-cost-budget
    config:
      route:
        paths:
        - /anthropic
        protocols:
        - http
        - https
        model:
          body:
            model:
            - claude-sonnet-4-5
      model:
        name_header: true
    targets:
    - name: claude-sonnet-5
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
        input_cost: 5
        output_cost: 15

  - ref: claude-sonnet-5
    type: model
    name: claude-sonnet-5
    display_name: "Claude Sonnet 5"
    enabled: true
