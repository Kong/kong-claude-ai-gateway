# Step 5 — Apply spend limits (per-group cost budgets via
# ai-rate-limiting-advanced).
#
# This is where "tiered model entitlement" actually happens. It replaces
# the single open `claude-chat` model from files 2-3 with three models
# sharing one route (distinguished by the `model` field a client sends in
# its request body) and adds one cost-budget policy matched per consumer
# group:
#
#   model            target             who can call it         budget/min
#   claude-baseline  Claude Haiku       every authenticated group  $5.00 / $1.00 / $0.20
#   claude-mid       Claude Sonnet      everyone except contractors (same budgets)
#   claude-premium   Claude Opus        everyone except contractors (same budgets)
#
# Budgets are COST-based, not token-based: `tokens_count_strategy: cost`
# makes `limit` a USD ceiling per window, computed from each target's
# input_cost/output_cost. That matters specifically because the three
# models above span a real price range behind shared groups — a token
# ceiling would silently mean three different real budgets depending on
# which model a caller happened to pick. HARD DEPENDENCY: every target
# needs both input_cost and output_cost set, or its usage contributes 0 to
# the budget and the limit silently never trips.
#
# Note the separator split: top-level `identifier` uses a HYPHEN
# (`consumer-group`); `policies[].match[].type` uses an UNDERSCORE
# (`consumer_group`). Easy to get backwards; called out here because it
# fails silently rather than erroring.
#
# This file REPLACES the `claude-chat` model, it doesn't add to it —
# `kongctl apply` creates the three new models but does NOT delete
# `claude-chat` server-side (apply never deletes; see
# ../kong-2.0/03-oidc-okta.yaml's header for the same caveat). Unlike an
# orphaned identity provider, an orphaned *model* is still a live, routable
# resource — if you don't want the old open /anthropic model reachable
# alongside the tiered ones, remove it explicitly (`kongctl sync` scoped to
# this namespace, or delete it directly) after confirming the tiered
# models work.
#
# UNVERIFIED IN THIS REPO: `route.methods` and `route.model.path_aliases`
# (the mechanism that lets three models share one route path, selected by
# the body's `model` field) come from a separately-verified POC config,
# not from this repo's own schema pulls — ../kong-2.0's models only ever
# used a plain `route.paths` with a 1:1 model. Run
# `kongctl explain ai_gateways.models.config.route --extended` against your
# environment and adjust if the field names differ.
#
# Apply: kongctl apply -f 4-rate-limiting-policy.yaml
# Preview first: kongctl diff -f 4-rate-limiting-policy.yaml

_defaults:
  kongctl:
    namespace: kong-app-gateway-claude

ai_gateways:
- ref: claude-tiered-gateway
  name: claude-tiered-gateway
  display_name: "Claude Tiered Gateway"
  description: "Kong AI Gateway 2.0 control plane fronting Claude for the kong-app-gateway-claude example"
  labels:
    repo: kong-app-gateway-claude
    example: tiered-model-entitlement

  identity_providers:
  - ref: okta-groups-idp
    name: okta-groups-idp
    display_name: "Okta OIDC (group claim)"
    type: openid-connect
    config:
      issuer: "{vault://claude-gateway-vault/okta-issuer}"
      client_id:
      - "{vault://claude-gateway-vault/okta-client-id}"
      client_secret:
      - "{vault://claude-gateway-vault/okta-client-secret}"
      cache_tokens_salt: "{vault://claude-gateway-vault/oidc-cache-tokens-salt}"
      auth_methods:
      - bearer
      consumer_claims:
      - sub
      consumer_groups_claim:
      - groups
      consumer_optional: true
      consumer_groups_optional: false
      ssl_verify: true

  consumer_groups:
  - ref: tier-platinum
    name: ai-platinum
  - ref: tier-standard
    name: ai-standard
  - ref: tier-contractors
    name: ai-contractors

  model_providers:
  - ref: anthropic-direct
    name: anthropic-direct
    display_name: "Anthropic (direct key)"
    type: anthropic
    config:
      auth:
        type: basic
        headers:
        - name: x-api-key
          value: "{vault://claude-gateway-vault/anthropic-api-key}"

  - ref: bedrock-claude
    name: bedrock-claude
    display_name: "AWS Bedrock (Claude)"
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://claude-gateway-vault/aws-access-key-id}"
        secret_access_key: "{vault://claude-gateway-vault/aws-secret-access-key}"

  policies:
  - ref: tiered-cost-budget
    name: tiered-cost-budget
    display_name: "Per-tier cost budget"
    type: ai-rate-limiting-advanced
    enabled: true
    config:
      identifier: consumer-group
      strategy: local     # per-DP counters; N data planes = N x limit.
                           # switch to redis (host+port) for a shared,
                           # multi-DP-accurate budget.
      policies:
      - match:
        - type: consumer_group
          values: [tier-platinum]
        window_type: sliding
        limits:
        - limit: 5.0        # USD per window, not tokens
          window_size: 60
          tokens_count_strategy: cost
      - match:
        - type: consumer_group
          values: [tier-standard]
        window_type: sliding
        limits:
        - limit: 1.0
          window_size: 60
          tokens_count_strategy: cost
      - match:
        - type: consumer_group
          values: [tier-contractors]
        window_type: sliding
        limits:
        - limit: 0.20
          window_size: 60
          tokens_count_strategy: cost

  models:
  # BASELINE — open to every authenticated group.
  - ref: claude-baseline
    type: model
    name: claude-baseline
    display_name: "Claude Baseline (Haiku)"
    enabled: true
    formats:
    - type: anthropic
    access:
      identity_providers:
      - okta-groups-idp
    policies:
    - tiered-cost-budget
    config:
      route:
        paths: [/anthropic]
        methods: [GET, POST]
        model:
          path_aliases: [claude-baseline]
      logging:
        payloads: true
    targets:
    - name: us.anthropic.claude-haiku-4-5-20251001-v1:0
      provider: bedrock-claude
      weight: 100
      config:
        type: bedrock
        region: us-east-1
        input_cost: 0.8      # USD / million input tokens — placeholder,
        output_cost: 4       # replace with current Anthropic/Bedrock pricing
    capabilities:
    - generate

  # MID — everyone except contractors.
  - ref: claude-mid
    type: model
    name: claude-mid
    display_name: "Claude Mid (Sonnet)"
    enabled: true
    formats:
    - type: anthropic
    access:
      identity_providers:
      - okta-groups-idp
      acls:
        deny: [tier-contractors]
    policies:
    - tiered-cost-budget
    config:
      route:
        paths: [/anthropic]
        methods: [GET, POST]
        model:
          path_aliases: [claude-mid]
      logging:
        payloads: true
    targets:
    - name: claude-sonnet-4-6
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
        input_cost: 5
        output_cost: 15
    capabilities:
    - generate

  # PREMIUM — everyone except contractors; differs from MID by target/cost
  # only, not by ACL. Add an `allow: [tier-platinum]` instead of `deny` here
  # if you want premium restricted to platinum alone.
  - ref: claude-premium
    type: model
    name: claude-premium
    display_name: "Claude Premium (Opus)"
    enabled: true
    formats:
    - type: anthropic
    access:
      identity_providers:
      - okta-groups-idp
      acls:
        deny: [tier-contractors]
    policies:
    - tiered-cost-budget
    config:
      route:
        paths: [/anthropic]
        methods: [GET, POST]
        model:
          path_aliases: [claude-premium]
      logging:
        payloads: true
    targets:
    - name: claude-opus-4-8
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
        input_cost: 15
        output_cost: 75
    capabilities:
    - generate
