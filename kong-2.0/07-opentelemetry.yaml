# Module 7 (2.0 track): OpenTelemetry tracing on `claude-chat` via an
# `opentelemetry` policy — same "per-model, not forced-global" pattern
# `pre-function` (module 4) and `ai-rate-limiting-advanced` (module 5)
# already confirmed live, plus a core, non-policy DP-level requirement
# this module cannot verify itself. See "THE INVESTIGATION" below.
#
# ============================================================================
# THE INVESTIGATION — real schema pulled and compared field-by-field,
# attachment scope confirmed live, neither assumed.
# ============================================================================
#
# Same as module 5, `kongctl explain ai_gateways.policies.config --extended`
# doesn't expand `config`'s nested fields — pulled the real schema directly
# from the Konnect API instead:
#
#   GET /v1/ai-gateways/{id}/policies/schemas/opentelemetry
#
# Fields relevant to this module, confirmed present and matching the
# brief's Step 2 draft exactly:
#   - `traces_endpoint` (string, referenceable) — matches
#     `traces_endpoint: http://otel-collector:4318/v1/traces` as-is.
#   - `logs_endpoint` (string, referenceable) — matches
#     `logs_endpoint: http://otel-collector:4318/v1/logs` as-is.
#   - `resource_attributes` (map[string]string) — matches
#     `resource_attributes: {service.name: claude-ai-gateway-2.0}` as-is.
#   - `config` has an `at_least_one_of: [traces_endpoint, logs_endpoint,
#     access_logs_endpoint, access_logs.endpoint, metrics]` entity check —
#     satisfied here since both `traces_endpoint` and `logs_endpoint` are
#     set.
#
# Unlike module 5, the brief's draft required NO correction — every field
# it proposed is real, at the path it proposed. One field beyond the
# brief's draft was added after the schema pull: `sampling_rate` (number,
# 0-1, "supersedes the global tracing_sampling_rate setting from
# kong.conf") is a real, optional, top-level config field. Set to `1`
# here as defense-in-depth, matching the 1.x track's own module 7
# (`docs/07-opentelemetry.md`'s gate #3) which had to set the equivalent
# `config.sampling_rate: 1` for the same reason: the schema's
# `sampling_strategy` field defaults to `parent_drop_probability_fallback`
# (same default described in the 1.x doc), and the described behavior
# under that strategy is the same failure mode the 1.x doc documents in
# detail — a low-probability core-level sampling decision can override
# a plugin-level 100% rate. This is a SCHEMA-LEVEL observation (the field
# and its default exist and are described this way in the real schema
# pulled above), not independent runtime confirmation that AI Gateway 2.0
# actually exhibits the failure — no Docker, no DP, same hard constraint
# as every prior module (see below).
#
# ============================================================================
# ATTACHMENT SCOPE — per-model, confirmed live via `kongctl diff`, NOT
# forced-global like `key-auth` (module 2).
# ============================================================================
#
# Tested the same way modules 2/4/5 did: planned (via `kongctl diff`, not
# applied — see below for why this run stopped short of `apply`) a
# throwaway `opentelemetry` policy (`otel-scope-test`, minimal
# `{traces_endpoint: http://otel-collector:4318/v1/traces}`, no `global`
# field set) attached via `claude-chat`'s `policies:` array only. The
# plan showed:
#
#   + [2:c:ai_gateway_policy:otel-scope-test] ai_gateway_policy
#     "otel-scope-test" will be created
#     enabled: true
#     global: false
#     ...
#   ~ [4:u:ai_gateway_model:claude-chat] ai_gateway_model "claude-chat"
#     will be updated
#     policies: [team-model-listing claude-token-rate-limit] →
#     [team-model-listing claude-token-rate-limit otel-scope-test]
#
# `kongctl` planned `global: false` with zero validation error — same
# result module 5 got for `ai-rate-limiting-advanced`. **`opentelemetry`
# does NOT share `key-auth`'s global-only restriction — confirmed live
# via a real plan against the real control plane, it attaches per-model
# the way `pre-function`/`ai-rate-limiting-advanced` do and the way the
# brief assumed.**
#
# That same throwaway-policy dry run also independently reproduced
# module 2/3's already-documented, unrelated finding: because this
# throwaway file was a full re-declaration missing module 2's still-live
# `claude-key-auth` global policy, the plan additionally showed
# `- [3:d:ai_gateway_policy:claude-key-auth] ... will be deleted`. Per
# `kong-2.0/03-oidc-okta.yaml`'s header comment (module 3's finding,
# confirmed via `kongctl apply --help`/`kongctl sync --help`), `kongctl
# apply` does NOT execute deletes shown in a plan — only a separate
# `kongctl sync` command does, and only for the resources a given sync
# run's file set covers. This run used `kongctl diff` only, deliberately
# not followed by `kongctl apply`, specifically because the throwaway
# file's `team-model-listing` policy body was a dummy stand-in (not
# module 4's real Lua) and applying it would have overwritten the live
# policy's real script even though the delete itself would not have
# executed. The real `kongctl apply` below (this module's actual,
# non-throwaway file) carries forward module 4/5's real
# `team-model-listing`/`claude-token-rate-limit` bodies unchanged, so
# applying it is safe by the same reasoning modules 4/5 used.
#
# ============================================================================
# THE PART THIS MODULE CANNOT VERIFY ITSELF — cited, secondhand, NOT
# independently confirmed.
# ============================================================================
#
# The shakeout's own `AIGW-2.0-ISSUES-RESOLVED.md`, Issue 21 ("`opentelemetry`
# plugin exports logs and metrics correctly, but never exports traces"),
# root-caused (2026-07-03) that real span export additionally requires
# Kong's CORE environment variables, set at the Kong Gateway node/process
# level — completely separate from this policy's own `traces_endpoint`/
# `sampling_rate` fields. The shakeout cited two required vars:
# `KONG_TRACING_INSTRUMENTATIONS` and `KONG_TRACING_SAMPLING_RATE`. Without
# them, Kong's tracing subsystem runs in "propagation-only" mode: it
# counts/logs spans internally and propagates W3C trace context, but never
# generates a real span object for this policy's exporter to send — logs and
# metrics (which don't depend on this core setting) export fine while traces
# silently don't. Once both were added to that shakeout's own DP compose
# file, 25 real spans arrived at the collector immediately
# (`{"otelcol.signal": "traces", "resource spans": 1, "spans": 25}`).
#
# The 1.x track's own `docs/07-opentelemetry.md` additionally documents a
# THIRD required var: `KONG_OPENTELEMETRY_TRACING: "all"`, explicitly stating
# tracing is "entirely disabled (`off`) by default at the Kong process level,
# independent of whether the `opentelemetry` plugin is configured." The 2.0
# shakeout's Issue 21 citation does not mention this third var — unclear
# whether AI Gateway 2.0's DP defaults tracing to "on" (making it unnecessary)
# or the shakeout's fix was incomplete. Per Task 8's review finding, all three
# vars are now added defensively to `docker-compose.aigw2.yml`, citing the
# 1.x doc as well-evidenced and conservative, with both sampling-rate var
# names (1.x's `KONG_OPENTELEMETRY_TRACING_SAMPLING_RATE` and 2.0's
# `KONG_TRACING_SAMPLING_RATE`) set since the exact one this build reads is
# unverified.
#
# This is a DIFFERENT environment (a different repo/DP/control plane) and
# was root-caused via DP process-level settings this task has zero way
# to verify — no Docker, no way to start a `kong-dp-2.0` container, same
# hard constraint confirmed 8+ times across modules 1-7. Cited here as
# secondhand, NOT re-derived or independently confirmed by this module. The
# env vars have been added to `docker-compose.aigw2.yml`'s `kong-dp-2.0`
# service on the strength of these citations, but their actual effect
# (whether spans arrive at a real collector when this exact 2.0 build's DP
# is started) is unverified in this sandbox.
#
# ============================================================================
# What this module actually does
# ============================================================================
#
# One new `ai_gateway_policy`, `claude-otel-tracing`
# (`type: opentelemetry`, model-scoped — `global` unset, defaults to
# `false`, confirmed above), added to `claude-chat`'s `policies:` list
# alongside module 4's `team-model-listing` and module 5's
# `claude-token-rate-limit` (both unchanged). `traces_endpoint`/
# `logs_endpoint` point at the same `otel-collector` service the 1.x
# track's `docker-compose.otel.yml` already runs (Jaeger UI on
# `localhost:16686`, same collector, same port — no re-pointing needed,
# per this task's interfaces). `resource_attributes.service.name:
# claude-ai-gateway-2.0` gives this track's traces a distinct service
# name in Jaeger so they don't get mixed in with the 1.x track's `kong`
# service if both stacks run against the same collector at once.
# `sampling_rate: 1` added beyond the brief's draft (see "THE
# INVESTIGATION" above) as defense-in-depth alongside the DP env vars,
# a real schema field.
#
# `kongctl diff`/`kongctl apply` against this module's real (not
# throwaway) file were run for real against the live control plane —
# config-side apply is achievable and was executed, unlike Steps 3-4's
# DP restart + live-traffic span check, which are NOT achievable here
# (no Docker). See `docs-2.0/07-opentelemetry-2.0.md`'s status banner
# for the exact result and what remains unverified.
#
# NOT independently verified here (same hard constraint as every prior
# module — no Docker, no serverless proxy URL, confirmed 8 times now):
#   - Real end-to-end span export to a collector/Jaeger over live HTTP
#     traffic. `scripts/verify-2.0.sh`'s new case is written for a future
#     Docker-enabled run, not exercised now.
#   - Whether the DP env vars added to `docker-compose.aigw2.yml` actually
#     produce real spans on THIS repo's 2.0 build — cited secondhand from
#     a different environment/repo, not re-derived.
#
# Carried over from modules 1-5 (same findings, not re-litigated here):
#   namespace `kong-claude-ai-gateway-2-0`; no `_external`/`selector` on
#   `ai_gateways` (full re-declaration so kongctl matches by
#   namespace+ref); `${{ env "..." }}` does NOT expand under kongctl
#   (module 3's finding); `claude-chat`'s route (`/anthropic`, prefix
#   match), targets (`anthropic-direct` weight 100, `bedrock-claude`
#   weight 1), `access.identity_providers: [okta-oidc]`,
#   `team-model-listing`, and `claude-token-rate-limit` policies are all
#   unchanged from module 5.

_defaults:
  kongctl:
    namespace: kong-claude-ai-gateway-2-0

ai_gateways:
- ref: claude-ai-gateway
  name: claude-ai-gateway
  display_name: "Claude AI Gateway (2.0)"
  description: "AI Gateway 2.0 control plane for kong-claude-ai-gateway"
  labels:
    repo: kong-claude-ai-gateway
    track: "2.0"

  identity_providers:
  - ref: okta-oidc
    name: okta-oidc
    display_name: "Okta OIDC"
    type: openid-connect
    config:
      issuer: "{vault://ai-vault/okta-issuer}"
      client_id:
      - "{vault://ai-vault/okta-client-id}"
      client_secret:
      - "{vault://ai-vault/okta-client-secret}"
      cache_tokens_salt: "{vault://ai-vault/oidc-cache-tokens-salt}"
      auth_methods:
      - authorization_code
      - session
      - bearer
      ssl_verify: true

  model_providers:
  - ref: anthropic-direct
    name: anthropic-direct
    display_name: "Anthropic (direct key)"
    type: anthropic
    config:
      auth:
        type: basic
        headers:
        - name: x-api-key
          value: "{vault://ai-vault/anthropic-api-key}"

  - ref: bedrock-claude
    name: bedrock-claude
    display_name: "AWS Bedrock (Claude)"
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai-vault/aws-access-key-id}"
        secret_access_key: "{vault://ai-vault/aws-secret-access-key}"

  policies:
  - ref: team-model-listing
    name: team-model-listing
    display_name: "Team-scoped model listing"
    type: pre-function
    enabled: true
    config:
      rewrite:
      - |
          -- Per-team static model listing for GET /anthropic/v1/models.
          -- Every other path under /anthropic (real chat traffic) is a
          -- no-op passthrough. Model-scoped (not global) — see
          -- kong-2.0/04-per-user-model-limits.yaml's header comment,
          -- Finding 3, for the live confirmation that pre-function
          -- attaches per-model like this.
          local jwt_parser = require "kong.plugins.jwt.jwt_parser"

          local MODELS_PATH = "/anthropic/v1/models"
          local CLAIM_NAME = "team"

          local PREMIUM_BODY = '{"data":[{"type":"model","id":"claude-opus-4-8"},{"type":"model","id":"claude-sonnet-4-6"}],"has_more":false}'
          local STANDARD_BODY = '{"data":[{"type":"model","id":"claude-sonnet-4-6"}],"has_more":false}'

          if kong.request.get_path() ~= MODELS_PATH then
            return
          end

          local authorization = kong.request.get_header("authorization")
          if not authorization then
            return kong.response.exit(401, { message = "missing bearer token" })
          end

          local token = authorization:match("^[Bb]earer%s+(.+)$")
          if not token then
            return kong.response.exit(401, { message = "malformed authorization header" })
          end

          local jwt = jwt_parser:new(token)
          if not jwt or not jwt.claims then
            return kong.response.exit(401, { message = "invalid token" })
          end

          local team = jwt.claims[CLAIM_NAME]

          if team == "kong-premium" then
            return kong.response.exit(200, PREMIUM_BODY, { ["Content-Type"] = "application/json" })
          elseif team == "kong-standard" then
            return kong.response.exit(200, STANDARD_BODY, { ["Content-Type"] = "application/json" })
          end

          return kong.response.exit(403, { message = "no recognized team claim for model listing" })

  - ref: claude-token-rate-limit
    name: claude-token-rate-limit
    display_name: "Claude token rate limit"
    type: ai-rate-limiting-advanced
    enabled: true
    config:
      identifier: consumer
      strategy: local
      tokens_count_strategy: total_tokens
      policies:
      - window_type: sliding
        limits:
        - limit: 5000
          window_size: 60

  - ref: claude-otel-tracing
    name: claude-otel-tracing
    display_name: "Claude OTel tracing"
    type: opentelemetry
    enabled: true
    config:
      traces_endpoint: http://otel-collector:4318/v1/traces
      logs_endpoint: http://otel-collector:4318/v1/logs
      resource_attributes:
        service.name: claude-ai-gateway-2.0
      sampling_rate: 1

  models:
  - ref: claude-chat
    type: model
    name: claude-chat
    display_name: "Claude Chat"
    enabled: true
    access:
      identity_providers:
      - okta-oidc
    formats:
    - type: anthropic
    config:
      route:
        paths:
        - /anthropic
      logging:
        payloads: true
    targets:
    - name: claude-sonnet-4-6
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
    - name: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      provider: bedrock-claude
      weight: 1
      config:
        type: bedrock
        region: us-east-1
    capabilities:
    - generate
    policies:
    - team-model-listing
    - claude-token-rate-limit
    - claude-otel-tracing
