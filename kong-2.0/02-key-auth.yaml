# Module 2 (2.0 track): key auth gating the `claude-chat` model.
#
# Cumulative file (matches the 1.x track's convention): repeats module 1's
# `model_providers`/`models` block from kong-2.0/01-general-proxying.yaml
# and adds a `key-auth` identity provider attached PER-MODEL to
# `claude-chat`, plus a Consumer + credential for Claude Desktop to
# authenticate with.
#
# ============================================================================
# CORRECTION (2026-07-23) to this file's own earlier design — read this
# before the rest of the header, it changes the whole mechanism.
# ============================================================================
#
# This file previously modeled key-auth as a `policies:` entry with
# `global: true`, because a real, live `kongctl apply` 400 —
# `ai_gateway_model.policies: policy "claude-key-auth" of type "key-auth"
# is not supported for scope "models"` — showed key-auth cannot attach to a
# model via the `policies:` list. That 400 was real and is still real
# (confirmed again this pass — see "The dead end that's still a dead end"
# below). The mistake was stopping there and concluding key-auth can
# therefore ONLY ever be global, unlike `openid-connect` (module 3), which
# correctly uses a separate `identity_providers` resource attached
# per-model via `access.identity_providers`.
#
# That conclusion was incomplete. Confirmed live via `kongctl explain
# ai_gateways.identity_providers --extended`:
#
#   - type: string required allowed: key-auth|openid-connect
#
# `identity_providers` supports `type: key-auth`, not only
# `type: openid-connect`. Module 3's own header comment already noted this
# in passing ("key-auth can ALSO be modeled as an identity provider") but
# didn't act on it, and this module's original version never revisited its
# own "global-only" framing to check. **Key-auth and OpenID Connect are
# consistent, not different**, once modeled the right way: BOTH are
# `identity_providers` resources with a `type` field, BOTH attach to a
# model via `access.identity_providers`, and BOTH scope per-model. The only
# thing that was ever global-only is `key-auth` declared under `policies:`
# — a real, distinct (and, per this correction, simply wrong) attachment
# path that this file no longer uses.
#
# ## The dead end that's still a dead end — `policies:`-based key-auth
#
# Re-confirmed live this pass, not just cited from the earlier finding:
# `kongctl explain ai_gateways.policies --extended` still shows
# `key-auth` as a valid generic policy `type` (the field has no closed
# enum), and a live `kongctl diff`/`apply` against `models[].policies:
# [claude-key-auth]` with a `key-auth`-type policy still 400s the same way
# it did before (`policy "claude-key-auth" of type "key-auth" is not
# supported for scope "models"`). That specific path — `policies:` +
# `type: key-auth` — is genuinely global-only (`global: true` is the only
# way to make it apply at all). This file simply doesn't use that path
# anymore; it uses `identity_providers` + `type: key-auth` instead, which
# is a completely different resource kind that happens to share the same
# `type` string.
#
# ## The corrected mechanism — `identity_providers`, `type: key-auth`
#
# Confirmed live via `kongctl explain ai_gateways.identity_providers
# --extended`, the full `config` field list for BOTH `type` values lives on
# the same schema (fields not applicable to the chosen `type` are simply
# unused): `hide_credentials`, `key_in_body`, `key_in_header`,
# `key_in_query`, `key_names` (key-auth-relevant), plus `auth_methods`,
# `cache_tokens_salt`, `client_id`, `client_secret`, `consumer_claims`,
# `consumer_optional`, `issuer`, `scopes`, `ssl_verify` (openid-connect-
# relevant, module 3 uses these). For `type: key-auth`, only `key_names`
# and `hide_credentials` are set below — same two fields the old
# `policies:`-based version used, confirming the credential-verification
# config itself didn't change, only where it's declared and how it
# attaches.
#
# `kongctl diff` against a real test file (`claude-key-auth` re-declared as
# an `identity_providers` entry, `claude-chat`'s `access.identity_providers`
# pointed at it) planned a clean create + model update with zero errors —
# see docs-2.0/02-key-auth-2.0.md's "vs. the brief" section for the full
# plan output and the reasoning for why this pass stopped at `diff` (real
# schema/API validation) rather than `apply` against the shared live
# control plane other modules' resources also live on.
#
# ## Credential mechanism — unchanged, still a separate `consumers` resource
#
# Confirmed via `kongctl explain ai_gateways.consumers --extended` and
# `ai_gateways.consumers.credentials --extended`: neither the consumer nor
# the credential schema has any field linking it to a specific
# `identity_providers` entry (no `identity_provider`/`identity_provider_ref`
# field anywhere). Credentials are NOT part of the `identity_providers`
# resource's own config — they're the same `ai_gateway_consumers[].
# credentials[]` mechanism this file already used under the old
# `policies`-based design, and the same `type: api-key`/no-settable-key-
# value limitation documented below still applies verbatim. Switching the
# attachment mechanism from `policies`+`global` to `identity_providers`+
# `access` did NOT introduce (or remove) a credential-storage mechanism —
# it only changed how the gate is scoped.
#
# ============================================================================
# Everything below is carried over from the original investigation and
# still applies as written:
# ============================================================================
#
#   - No `_external`/`selector` field on `ai_gateways` (same finding as
#     module 1) — this file re-declares the same `ai_gateway` (ref
#     `claude-ai-gateway`, identical name/display_name/description/labels)
#     so kongctl matches the live control plane by namespace+ref and
#     updates it in place rather than creating a second one.
#   - `ai_gateways.consumers[].key_auth_credentials:` (the brief's Step 2
#     field name) does not exist. The real field is `credentials:` (plural,
#     generic — not auth-type-specific), and each credential requires
#     `ref`/`name`/`type`/`display_name` (confirmed via `kongctl explain
#     ai_gateways.consumers --extended` and
#     `ai_gateways.consumers.credentials --extended`).
#   - CRITICAL GAP: kongctl's declarative `credentials[]` schema has NO
#     field for the actual key/secret value at all (no `key`, `api_key`,
#     or `config` property — `additionalProperties: false` on the schema
#     blocks anything else). The raw Konnect API
#     (`create_ai_gateway_consumer_credential`) DOES accept an optional
#     `api_key` string ("If not provided, then the key will be auto
#     generated by the server and returned in the response") — but kongctl
#     has no declarative surface for it. This means the brief's
#     `key: "${{ env "KONGCTL_CONSUMER_API_KEY" }}"` approach is NOT
#     achievable via `kongctl apply` as written: `kongctl` cannot set a
#     custom key value, only Konnect's auto-generated one. This repo
#     documents that limitation rather than working around it with a
#     second, non-declarative API call that would silently drift from the
#     YAML on every `kongctl apply`. See docs-2.0/02-key-auth-2.0.md for
#     how to retrieve the actual server-generated key after apply.
#   - Consumer/credential `type` is `api-key` (confirmed via the Konnect
#     API's `create_ai_gateway_consumer` output schema: `type: enum
#     ["api-key", "oauth"]`), not a made-up `key-auth`-shaped value — the
#     identity provider's `type: key-auth` (the Kong 3 plugin-name
#     equivalent) and the consumer/credential's `type: api-key` are two
#     different fields.
#   - `hide_credentials` is set to `true` here (not the brief's literal
#     `false`) per the brief's own fallback guidance ("should stay `true`
#     ... unless live testing shows a reason not to") — this module could
#     not live-test the data-plane behavior (no Docker/DP access, same
#     constraint as module 1), so the safer default matching 1.x's
#     implicit `key-auth` default is kept.
#
# ## What replaces module 3's OIDC gate now (swap, not stack)
#
# Per the confirmed 1.x precedent (`kong/03-oidc-okta.yaml` drops the
# `key-auth` plugin entirely and runs only `openid-connect` — verified by
# reading that file: its `plugins:` list has no `key-auth` entry, only
# `openid-connect` + `ai-proxy-advanced`/`request-transformer-advanced`),
# module 3's `kong-2.0/03-oidc-okta.yaml` REPLACES this module's
# `claude-key-auth` identity provider with `okta-oidc` on `claude-chat`'s
# `access.identity_providers` list — it does not add OIDC alongside
# key-auth. Because both are now modeled as the same `identity_providers`
# resource kind, module 3's `access.identity_providers` re-declaration is a
# literal, direct swap of one ref for another on the same field — not the
# old design's problem of a `policies`-based `global: true` policy staying
# active (gateway-wide) alongside a model-scoped OIDC gate. See
# `kong-2.0/03-oidc-okta.yaml`'s header for what live-testing confirmed
# about this swap.

_defaults:
  kongctl:
    namespace: kong-claude-ai-gateway-2-0

ai_gateways:
- ref: claude-ai-gateway
  name: claude-ai-gateway
  display_name: "Claude AI Gateway (2.0)"
  description: "AI Gateway 2.0 control plane for kong-claude-ai-gateway"
  labels:
    repo: kong-claude-ai-gateway
    track: "2.0"

  identity_providers:
  - ref: claude-key-auth
    name: claude-key-auth
    display_name: "Claude Key Auth"
    type: key-auth
    config:
      key_names:
      - x-api-key
      hide_credentials: true

  model_providers:
  - ref: anthropic-direct
    name: anthropic-direct
    display_name: "Anthropic (direct key)"
    type: anthropic
    config:
      auth:
        type: basic
        headers:
        - name: x-api-key
          value: "{vault://ai-vault/anthropic-api-key}"

  - ref: bedrock-claude
    name: bedrock-claude
    display_name: "AWS Bedrock (Claude)"
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai-vault/aws-access-key-id}"
        secret_access_key: "{vault://ai-vault/aws-secret-access-key}"

  models:
  - ref: claude-chat
    type: model
    name: claude-chat
    display_name: "Claude Chat"
    enabled: true
    access:
      identity_providers:
      - claude-key-auth
    formats:
    - type: anthropic
    config:
      route:
        paths:
        - /anthropic
      # See kong-2.0/01-general-proxying.yaml for why payload logging is on
      # (deliberate parity with the 1.x track's ai-proxy-advanced logging
      # config, demo/reference build only).
      logging:
        payloads: true
    targets:
    - name: claude-sonnet-4-6
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
    - name: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      provider: bedrock-claude
      weight: 1
      config:
        type: bedrock
        region: us-east-1
    capabilities:
    - generate

  consumers:
  - ref: claude-desktop
    name: claude-desktop
    type: api-key
    display_name: "Claude Desktop"
    credentials:
    - ref: claude-desktop-api-key
      name: claude-desktop-api-key
      type: api-key
      display_name: "Claude Desktop API Key"
