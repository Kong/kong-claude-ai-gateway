# Module 2 (2.0 track): key auth gating the `claude-chat` model.
#
# Cumulative file (matches the 1.x track's convention): repeats module 1's
# `model_providers`/`models` block from kong-2.0/01-general-proxying.yaml
# and adds a global `key-auth` policy, plus a Consumer + credential for
# Claude Desktop to authenticate with.
#
# Deviations from the task brief's literal Step 1/Step 2, all found live
# against the real Konnect API/kongctl schema (`kongctl explain
# ai_gateways.policies --extended`, `kongctl explain ai_gateways.consumers
# --extended`, `kongctl explain ai_gateways.models --extended`, plus a real
# `kongctl apply` 400 error and the Konnect MCP tool's
# `create_ai_gateway_consumer_credential` / `create_ai_gateway_consumer`
# input+output schemas) — see docs-2.0/02-key-auth-2.0.md's "vs. the brief"
# note and task-3-report.md for the full trail:
#
#   - No `_external`/`selector` field on `ai_gateways` (same finding as
#     module 1) — this file re-declares the same `ai_gateway` (ref
#     `claude-ai-gateway`, identical name/display_name/description/labels)
#     so kongctl matches the live control plane by namespace+ref and
#     updates it in place rather than creating a second one.
#   - THE BIG ONE: `models[].policies: [claude-key-auth]` (the brief's
#     literal Step 1 shape, and this file's own first draft) is REJECTED
#     live by the Konnect API with a real 400: `ai_gateway_model.policies:
#     policy "claude-key-auth" of type "key-auth" is not supported for
#     scope "models"`. `key-auth` cannot be attached per-model at all —
#     policy types have server-enforced allowed scopes, and `key-auth`'s
#     is NOT "models". The working mechanism instead is `global: true` on
#     the policy itself (confirmed live: creating the policy with
#     `global: true` and NOT listing it in the model's `policies:` applied
#     cleanly, `kongctl diff` afterward shows zero drift). A global
#     key-auth policy is enforced across the whole `claude-ai-gateway`
#     control plane, which in this repo (one model, `claude-chat`) has the
#     same practical effect as gating that one model — but note this is
#     gateway-wide, not model-scoped, so a future module adding a second
#     model to this control plane would also be gated by this same policy
#     unless it's changed. This is a materially different mechanism than
#     both the brief assumed AND than what "vs. 1.x" originally implied
#     ("auth moves from inline plugin to a policy referenced by the
#     model's policies list") — the model's `policies:` list field exists
#     in the schema but is not the attachment path for credential-type
#     policies like `key-auth`. Whether other policy types (e.g.
#     `openid-connect`, relevant to a future OIDC module) share this
#     "global-only" restriction was NOT tested here — that's open for
#     whoever builds that module to confirm via `kongctl explain`/a real
#     apply, not assume from this finding.
#   - `ai_gateways.consumers[].key_auth_credentials:` (the brief's Step 2
#     field name) does not exist. The real field is `credentials:` (plural,
#     generic — not auth-type-specific), and each credential requires
#     `ref`/`name`/`type`/`display_name` (confirmed via `kongctl explain
#     ai_gateways.consumers --extended` and
#     `ai_gateways.consumers.credentials --extended`).
#   - CRITICAL GAP: kongctl's declarative `credentials[]` schema has NO
#     field for the actual key/secret value at all (no `key`, `api_key`,
#     or `config` property — `additionalProperties: false` on the schema
#     blocks anything else). The raw Konnect API
#     (`create_ai_gateway_consumer_credential`) DOES accept an optional
#     `api_key` string ("If not provided, then the key will be auto
#     generated by the server and returned in the response") — but kongctl
#     has no declarative surface for it. This means the brief's
#     `key: "${{ env "KONGCTL_CONSUMER_API_KEY" }}"` approach is NOT
#     achievable via `kongctl apply` as written: `kongctl` cannot set a
#     custom key value, only Konnect's auto-generated one. This repo
#     documents that limitation rather than working around it with a
#     second, non-declarative API call that would silently drift from the
#     YAML on every `kongctl apply`. See docs-2.0/02-key-auth-2.0.md for
#     how to retrieve the actual server-generated key after apply.
#   - Consumer/credential `type` is `api-key` (confirmed via the Konnect
#     API's `create_ai_gateway_consumer` output schema: `type: enum
#     ["api-key", "oauth"]`), not a made-up `key-auth`-shaped value — the
#     policy's `type: key-auth` (the Kong 3 plugin-name equivalent) and the
#     consumer/credential's `type: api-key` are two different fields.
#   - `hide_credentials` is set to `true` here (not the brief's literal
#     `false`) per the brief's own fallback guidance ("should stay `true`
#     ... unless live testing shows a reason not to") — this module could
#     not live-test the data-plane behavior (no Docker/DP access, same
#     constraint as module 1), so the safer default matching 1.x's
#     implicit `key-auth` default is kept.

_defaults:
  kongctl:
    namespace: kong-claude-ai-gateway-2-0

ai_gateways:
- ref: claude-ai-gateway
  name: claude-ai-gateway
  display_name: "Claude AI Gateway (2.0)"
  description: "AI Gateway 2.0 control plane for kong-claude-ai-gateway"
  labels:
    repo: kong-claude-ai-gateway
    track: "2.0"

  policies:
  - ref: claude-key-auth
    name: claude-key-auth
    display_name: "Claude Key Auth"
    type: key-auth
    enabled: true
    global: true
    config:
      key_names:
      - x-api-key
      hide_credentials: true

  model_providers:
  - ref: anthropic-direct
    name: anthropic-direct
    display_name: "Anthropic (direct key)"
    type: anthropic
    config:
      auth:
        type: basic
        headers:
        - name: x-api-key
          value: "{vault://ai-vault/anthropic-api-key}"

  - ref: bedrock-claude
    name: bedrock-claude
    display_name: "AWS Bedrock (Claude)"
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai-vault/aws-access-key-id}"
        secret_access_key: "{vault://ai-vault/aws-secret-access-key}"

  models:
  - ref: claude-chat
    type: model
    name: claude-chat
    display_name: "Claude Chat"
    enabled: true
    formats:
    - type: anthropic
    config:
      route:
        paths:
        - /anthropic
      # See kong-2.0/01-general-proxying.yaml for why payload logging is on
      # (deliberate parity with the 1.x track's ai-proxy-advanced logging
      # config, demo/reference build only).
      logging:
        payloads: true
    targets:
    - name: claude-sonnet-4-6
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
    - name: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      provider: bedrock-claude
      weight: 1
      config:
        type: bedrock
        region: us-east-1
    capabilities:
    - generate

  consumers:
  - ref: claude-desktop
    name: claude-desktop
    type: api-key
    display_name: "Claude Desktop"
    credentials:
    - ref: claude-desktop-api-key
      name: claude-desktop-api-key
      type: api-key
      display_name: "Claude Desktop API Key"
