# Module 5 (2.0 track): Consumer-based token rate limiting on `claude-chat`
# via an `ai-rate-limiting-advanced` policy.
#
# THIS MODULE'S CONFIG SHAPE DIVERGES FROM THE BRIEF'S STEP 1 DRAFT IN ONE
# FIELD, CONFIRMED LIVE AGAINST THE REAL PLUGIN SCHEMA — everything else in
# the brief's draft (`identifier`, `strategy`, `policies[].window_type`,
# `policies[].limits[].limit`/`window_size`) matches the real schema
# as-is. See "The investigation" below for the evidence.
#
# ============================================================================
# THE INVESTIGATION — real schema pulled and compared field-by-field,
# attachment scope confirmed live, neither assumed.
# ============================================================================
#
# `kongctl explain ai_gateways.policies.config --extended` doesn't expand
# `config`'s nested fields (same opaque `map[string]` behavior module 4
# hit on `ai_gateways.models.config.route`) — so the real schema was
# pulled directly from the Konnect API instead:
#
#   GET /v1/ai-gateways/{id}/policies/schemas/ai-rate-limiting-advanced
#
# Full schema returned (fields relevant to this module):
#   - `identifier` (required, default `consumer`, one_of
#     ip|credential|consumer|service|header|path|consumer-group) — matches
#     the brief's `identifier: consumer` exactly.
#   - `strategy` (required, default `local`, one_of local|redis|cluster) —
#     matches the brief's `strategy: local` exactly.
#   - `policies[]` (required, len_min 1): each entry has an optional
#     `match[]` (array of `{type, values, key, partition_by}` — omit to
#     act as a fallback for all requests, which is what this module does:
#     no `match` block, so the single policy applies to every request),
#     an optional `limits[]` (`{limit, window_size, tokens_count_strategy,
#     ...calendar fields}`), and a PER-POLICY `window_type` (default
#     `sliding`, one_of fixed|sliding|calendar) — this is exactly where
#     the brief's Step 1 draft put `window_type: sliding` (nested one
#     level inside a `policies[]` entry, not top-level config). The
#     brief's draft was right about this field's placement.
#   - `tokens_count_strategy` exists in TWO places in the real schema: a
#     top-level `config.tokens_count_strategy` (default `total_tokens`,
#     described as "what tokens to use for cost calculation") AND a
#     per-limit `policies[].limits[].tokens_count_strategy` (same
#     enum, described as "what to count for THIS limit" — i.e. it can
#     override the top-level default per limit entry). The brief put
#     `tokens_count_strategy: total_tokens` at the top level, which is a
#     real, valid field placement — kept as-is below since this module
#     only has one limit and doesn't need a per-limit override.
#   - **`llm_format` DOES NOT EXIST ANYWHERE IN THE REAL SCHEMA.** Grepped
#     the full schema JSON for the literal string `"llm_format"` — zero
#     matches. The brief's Step 1 draft included
#     `config.llm_format: anthropic`, which is not a real field on this
#     plugin's config at all (confirmed absent, not just undocumented —
#     this schema pull is the plugin's actual field list, generated from
#     the same source Kong Gateway itself validates against). Dropped
#     from this module's shipped config; a real `kongctl apply` with it
#     present is untested here since the brief's assumption was falsified
#     before an apply was attempted with it included, but shipping an
#     unrecognized/dead field to a live control plane serves no purpose
#     once its absence from the schema is directly confirmed.
#
# Prior art (secondhand, cited as supporting context, NOT this module's
# own verification): `~/claude/projects/aigw2.0-test/AIGW-2.0-POC-CRITERIA-
# FINDINGS.md` and that repo's `poc-default-ai-gateway-2.0.yaml` (a
# different environment/control plane, dated entries through 2026-07-08)
# independently arrived at the same real shape while porting a 1.x
# `ai-rate-limiting-advanced` config — `identifier`/`strategy` top-level,
# `policies[].limits[].tokens_count_strategy` nested, zero `llm_format`
# anywhere across four separate `ai-rate-limiting-advanced` instances in
# that file. That repo also states its own finding plainly: "1.x's flat
# `llm_providers: [{name, window_size, limit}]` doesn't carry over — 2.0's
# schema is a match-condition + limits-array shape" (their Issue 3,
# resolved) — consistent with what this module found independently via
# the live schema pull above, not re-derived from their file, but a
# useful cross-check that the shape is stable across environments/dates.
#
# ============================================================================
# ATTACHMENT SCOPE — per-model, confirmed live, NOT the `policies:`+
# `key-auth` forced-global restriction module 2 originally found (module 2
# has since been corrected to use `identity_providers` instead, which is
# per-model — see that file's header).
# ============================================================================
#
# Tested the same way modules 2-4 did: applied a throwaway
# `ai-rate-limiting-advanced` policy (`claude-rate-limit-test`, minimal
# `{identifier: consumer, strategy: local, policies: [{limits: [{limit: 1,
# window_size: 60}]}]}`, no `global` field set) attached via `claude-chat`'s
# `policies:` array only (not `global: true` control-plane-wide). `kongctl
# diff` planned it as:
#
#   + [1:c:ai_gateway_policy:claude-rate-limit-test] ...
#     global: false
#   ~ [2:u:ai_gateway_model:claude-chat] ...
#     policies: [team-model-listing] → [team-model-listing, claude-rate-limit-test]
#
# `kongctl apply` created/updated with zero error. `kongctl get ai-gateway
# policies --gateway-id "$GWID" -o json` confirmed `"global": false`
# server-side for the new policy; `kongctl get ai-gateway models
# --gateway-id "$GWID" -o json` confirmed `claude-chat`'s `policies` array
# contains both refs. **`ai-rate-limiting-advanced` does NOT share
# `key-auth`'s `policies:`-attachment global-only restriction — confirmed
# live, it attaches per-model exactly the way `pre-function` (module 4)
# does and the way the brief assumed.** (Key-auth itself no longer uses
# that `policies:` path either as of the 2026-07-23 correction to
# `kong-2.0/02-key-auth.yaml` — see that file's header.) The throwaway policy was retired by re-applying
# `claude-chat` with the real policy list below (which replaces the test
# ref) and deleting the now-unreferenced test policy directly via the API
# afterward (`DELETE /v1/ai-gateways/{id}/policies/{id}` → `204`).
#
# ============================================================================
# What this module actually does
# ============================================================================
#
# One new `ai_gateway_policy`, `claude-token-rate-limit`
# (`type: ai-rate-limiting-advanced`, model-scoped — `global` unset,
# defaults to `false`, confirmed above), added to `claude-chat`'s
# `policies:` list alongside module 4's `team-model-listing` (unchanged).
# `identifier: consumer` scopes the counter per authenticated caller (the
# `okta-oidc` identity provider from module 3 populates the consumer
# context this identifier reads); `strategy: local` keeps counters in
# each nginx worker's own memory (no Redis dependency for this module);
# a single fallback policy entry (no `match` block, so it applies to
# every request through this model) enforces a 5000-total-token sliding
# window per 60 seconds.
#
# NOT independently verified here (same hard constraint as every prior
# module — no Docker, no serverless proxy URL, confirmed 5 times now):
#   - Real end-to-end rate-limit tripping (a 429 after the budget is
#     exhausted) over live HTTP. `scripts/verify-2.0.sh`'s new case is
#     written for a future Docker-enabled run, not exercised now.
#   - The shakeout's own AIGW-2.0-TEST-REPO real-traffic 429 confirmation
#     against AI GW 3.4/3.5 (cited in this task's brief) is from a
#     DIFFERENT environment and an EARLIER AI GW build than this repo's
#     control plane — cited here as secondhand supporting context that
#     the plugin type is known to trip real 429s on comparable AI Gateway
#     2.0 builds, NOT as this module's own live verification of that
#     behavior.
#
# Carried over from modules 1-4 (same findings, not re-litigated here):
#   namespace `kong-claude-ai-gateway-2-0`; no `_external`/`selector` on
#   `ai_gateways` (full re-declaration so kongctl matches by
#   namespace+ref); `${{ env "..." }}` does NOT expand under kongctl
#   (module 3's finding) — this module has no secret/environment-derived
#   values to template in the first place, so it doesn't hit that gap;
#   `claude-chat`'s route (`/anthropic`, prefix match), targets
#   (`anthropic-direct` weight 100, `bedrock-claude` weight 1),
#   `access.identity_providers: [okta-oidc]`, and `team-model-listing`
#   policy are all unchanged from module 4.

_defaults:
  kongctl:
    namespace: kong-claude-ai-gateway-2-0

ai_gateways:
- ref: claude-ai-gateway
  name: claude-ai-gateway
  display_name: "Claude AI Gateway (2.0)"
  description: "AI Gateway 2.0 control plane for kong-claude-ai-gateway"
  labels:
    repo: kong-claude-ai-gateway
    track: "2.0"

  identity_providers:
  - ref: okta-oidc
    name: okta-oidc
    display_name: "Okta OIDC"
    type: openid-connect
    config:
      issuer: "{vault://ai-vault/okta-issuer}"
      client_id:
      - "{vault://ai-vault/okta-client-id}"
      client_secret:
      - "{vault://ai-vault/okta-client-secret}"
      cache_tokens_salt: "{vault://ai-vault/oidc-cache-tokens-salt}"
      auth_methods:
      - authorization_code
      - session
      - bearer
      ssl_verify: true

  model_providers:
  - ref: anthropic-direct
    name: anthropic-direct
    display_name: "Anthropic (direct key)"
    type: anthropic
    config:
      auth:
        type: basic
        headers:
        - name: x-api-key
          value: "{vault://ai-vault/anthropic-api-key}"

  - ref: bedrock-claude
    name: bedrock-claude
    display_name: "AWS Bedrock (Claude)"
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai-vault/aws-access-key-id}"
        secret_access_key: "{vault://ai-vault/aws-secret-access-key}"

  policies:
  - ref: team-model-listing
    name: team-model-listing
    display_name: "Team-scoped model listing"
    type: pre-function
    enabled: true
    config:
      rewrite:
      - |
          -- Per-team static model listing for GET /anthropic/v1/models.
          -- Every other path under /anthropic (real chat traffic) is a
          -- no-op passthrough. Model-scoped (not global) — see
          -- kong-2.0/04-per-user-model-limits.yaml's header comment,
          -- Finding 3, for the live confirmation that pre-function
          -- attaches per-model like this.
          local jwt_parser = require "kong.plugins.jwt.jwt_parser"

          local MODELS_PATH = "/anthropic/v1/models"
          local CLAIM_NAME = "team"

          local PREMIUM_BODY = '{"data":[{"type":"model","id":"claude-opus-4-8"},{"type":"model","id":"claude-sonnet-4-6"}],"has_more":false}'
          local STANDARD_BODY = '{"data":[{"type":"model","id":"claude-sonnet-4-6"}],"has_more":false}'

          if kong.request.get_path() ~= MODELS_PATH then
            return
          end

          local authorization = kong.request.get_header("authorization")
          if not authorization then
            return kong.response.exit(401, { message = "missing bearer token" })
          end

          local token = authorization:match("^[Bb]earer%s+(.+)$")
          if not token then
            return kong.response.exit(401, { message = "malformed authorization header" })
          end

          local jwt = jwt_parser:new(token)
          if not jwt or not jwt.claims then
            return kong.response.exit(401, { message = "invalid token" })
          end

          local team = jwt.claims[CLAIM_NAME]

          if team == "kong-premium" then
            return kong.response.exit(200, PREMIUM_BODY, { ["Content-Type"] = "application/json" })
          elseif team == "kong-standard" then
            return kong.response.exit(200, STANDARD_BODY, { ["Content-Type"] = "application/json" })
          end

          return kong.response.exit(403, { message = "no recognized team claim for model listing" })

  - ref: claude-token-rate-limit
    name: claude-token-rate-limit
    display_name: "Claude token rate limit"
    type: ai-rate-limiting-advanced
    enabled: true
    config:
      identifier: consumer
      strategy: local
      tokens_count_strategy: total_tokens
      policies:
      - window_type: sliding
        limits:
        - limit: 5000
          window_size: 60

  models:
  - ref: claude-chat
    type: model
    name: claude-chat
    display_name: "Claude Chat"
    enabled: true
    access:
      identity_providers:
      - okta-oidc
    formats:
    - type: anthropic
    config:
      route:
        paths:
        - /anthropic
      logging:
        payloads: true
    targets:
    - name: claude-sonnet-4-6
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
    - name: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      provider: bedrock-claude
      weight: 1
      config:
        type: bedrock
        region: us-east-1
    capabilities:
    - generate
    policies:
    - team-model-listing
    - claude-token-rate-limit
