# Module 3 (2.0 track): Okta OIDC gating the `claude-chat` model.
#
# Cumulative file (matches the 1.x track's convention): repeats module 1's
# `model_providers`/`models` block and, per this module's Step 1 brief note
# and the confirmed 1.x precedent (`kong/03-oidc-okta.yaml` replaces its
# module 2 key-auth plugin with `openid-connect` entirely, it does not run
# both), REPLACES module 2's `claude-key-auth` global policy and the
# `claude-desktop` consumer/credential with an `identity_providers` entry —
# `claude-chat`'s `access.identity_providers` now points at `okta-oidc`
# instead of relying on the control-plane-wide `claude-key-auth` policy.
#
# CORRECTION to the brief's assumption that `kongctl apply` (described as
# "sync semantics") would delete the now-unused `claude-key-auth` policy
# and `claude-desktop` consumer/credential: confirmed live via `kongctl
# apply --help` / `kongctl sync --help` that this is NOT how kongctl works.
# `apply` is explicitly create/update-only ("Never deletes resources" —
# `kongctl apply konnect --help`'s own description); only the separate
# `kongctl sync` command deletes resources no longer present in the applied
# file set, and only for resources within the namespace that sync run
# actually processes. Running `kongctl apply -f kong-2.0/03-oidc-okta.yaml`
# (as this module's own "Apply it" section does) leaves module 2's
# `claude-key-auth`/`claude-desktop`/`claude-desktop-api-key` resources
# fully intact server-side — confirmed live, they were NOT removed by this
# module's apply. To actually retire them (matching 1.x's module 3, which
# does drop key-auth), a future `kongctl sync` run covering the whole
# `kong-2.0/` directory (not just this file) would be needed — out of
# scope to run here since it would also need to safely handle every other
# module's resources in the same pass. Document, don't silently assume.
#
# THE CENTRAL FINDING OF THIS MODULE — the model-scope-vs-global question
# module 2 explicitly left open (does `openid-connect` share `key-auth`'s
# "policy scope=models is not supported, must be global:true" restriction?)
# is answered: NO, it does not share that restriction, because
# `openid-connect` isn't attached the same way `key-auth` was in module 2
# at all. Confirmed via `kongctl explain ai_gateways.identity_providers
# --extended` and `kongctl explain ai_gateways.models --extended`:
#
#   - `identity_providers` is its OWN top-level/child resource type
#     (`ai_gateway_identity_providers[]`), separate from `policies`
#     (`ai_gateway_policies[]`). Its `type` field is a closed enum:
#     `key-auth|openid-connect` — so `key-auth` can ALSO be modeled as an
#     identity provider, not only as a `policies[]` entry the way module 2
#     used it. These are two different resource kinds that happen to
#     overlap on one type name.
#   - Models have a dedicated `access.identity_providers: array[string]`
#     field (confirmed present in `kongctl explain ai_gateways.models
#     --extended`'s `access:` block, alongside `access.acls`) — genuinely
#     separate from the model's `policies: array[string]` field that
#     module 2 found does NOT accept `key-auth`. The brief's assumed shape
#     (`access.identity_providers` on the model, referencing an
#     `identity_providers[].ref`) is confirmed CORRECT as literally
#     written — no schema correction was needed here, unlike module 2.
#   - Net effect: `identity_providers`-based auth (this module) attaches
#     PER-MODEL via `access.identity_providers`, unlike `policies`-based
#     `key-auth` (module 2), which could only be applied `global: true`
#     across the whole control plane. This module's `okta-oidc` identity
#     provider is referenced ONLY from `claude-chat`'s
#     `access.identity_providers` list — a future model added to this same
#     `claude-ai-gateway` control plane would NOT automatically inherit
#     this gating (the opposite of module 2's global-policy behavior).
#   - NOT independently re-tested here: whether `openid-connect` would also
#     be rejected under `policies:` the way `key-auth` was under `models`
#     scope in module 2 (the brief's warning that `policies:` "silently
#     zeroes the config" for `openid-connect`). This module doesn't use
#     `policies:` for auth at all — it uses the dedicated
#     `identity_providers` resource, which is confirmed to work and is the
#     documented/intended mechanism, so that alternate failure path was not
#     provoked or verified. Don't treat the brief's "silently zeroes"
#     claim as independently confirmed by this module — it wasn't
#     re-tested, just avoided.
#
# SECOND FINDING — `${{ env "..." }}` (the brief's literal Step 1 syntax
# for `issuer`/`client_id`/`client_secret`, copied from decK's tag syntax
# used by `kong/03-oidc-okta.yaml` in the 1.x/decK track) does NOT work
# with kongctl. Confirmed live with an isolated one-field test file (set
# `description: ${{ env "TEST_TAG_VALUE" }}` on the already-existing
# `claude-ai-gateway` and ran `kongctl diff` with `TEST_TAG_VALUE`
# exported): the plan showed the field would change TO the literal string
# `${{ env \"TEST_TAG_VALUE\" }}`, unexpanded — kongctl never substitutes
# it, it's sent to the Konnect API as-is. This first surfaced here as a
# live 400 (`config.issuer: missing host in url` — because the raw
# unexpanded tag string isn't a valid URL) when this module's config was
# still using that syntax for `issuer`. This matches Task 1's independent
# finding (`docs-2.0/00-prerequisites-2.0.md`/`task-1-report.md`) that the
# brief's `${{ env "KONGCTL_VAULT_CONFIG_STORE_ID" }}` for the platform
# vault also wouldn't work — Task 1 sidestepped it by not declaring the
# vault via kongctl at all. This module can't sidestep it the same way
# (there's no non-kongctl path to create an `ai_gateway_identity_provider`
# short of the raw API, which would fight kongctl's ownership of it), so
# instead: `issuer`/`client_id`/`client_secret`/`cache_tokens_salt` are all
# `{vault://ai-vault/<key>}` references — the SAME mechanism module 1/2
# already use for `anthropic-api-key`/`aws-access-key-id`/
# `aws-secret-access-key`. Unlike the `${{ env }}` tag, `{vault://...}` is
# NOT resolved by kongctl at all (confirmed: `kongctl diff`/`apply` pass
# the literal `{vault://ai-vault/okta-issuer}` string straight through to
# the Konnect API, same as it does for the existing model_providers vault
# refs) — it's resolved server-side by Kong at runtime. This means the
# four Okta values must be seeded into the `ai-vault` config store as
# secrets BEFORE this module's `kongctl apply` will produce a working
# identity provider — see docs-2.0/03-oidc-okta-2.0.md for the exact
# out-of-band `POST .../config-stores/{id}/secrets` commands (this
# module's `scripts/00-bootstrap-konnect-2.0.sh` — out of scope for this
# task's file list — does not seed these yet; a future task should add it,
# same as it does for the anthropic/AWS secrets).
#
# THIRD FINDING (a real 400, worth keeping as the paper trail) —
# `config.cache_tokens_salt` is REQUIRED for `type: openid-connect`
# identity providers, not optional as `kongctl explain
# ai_gateways.identity_providers --extended` implied (it lists the field
# without marking it required). Confirmed two ways: (1) a real `kongctl
# apply` 400, `the current SDK rejected the payload; verify the resource
# fields with kongctl explain`, when `cache_tokens_salt` was omitted; (2)
# the Konnect MCP tool's `create_ai_gateway_identity_provider` output
# schema (`mcp__plugin_kong-konnect_kong-konnect__get_schema`), whose
# `openid-connect` variant's `config` object lists `"required": [
# "cache_tokens_salt"]` explicitly. This module's `okta-oidc` identity
# provider config includes it (via vault ref, matching 1.x's
# `OIDC_CACHE_TOKENS_SALT` var in spirit).
#
# Also carried over from module 1/2 (same findings, not re-litigated here):
#   - No `_external`/`selector` field on `ai_gateways` — this file
#     re-declares the same `ai_gateway` (ref `claude-ai-gateway`, identical
#     name/display_name/description/labels) so kongctl matches the live
#     control plane by namespace+ref.
#   - `model_providers[].config.auth` field names (`access_key_id`/
#     `secret_access_key`, not the brief's `aws_access_key_id`/
#     `aws_secret_access_key`) match module 1/2's already-corrected shape.
#   - `targets` (not `target_models`), `config.version` (not
#     `anthropic_version`), `config.region` (not a nested `bedrock_model_id`
#     key) match module 1/2's already-corrected target shape.
#
# Okta application: bring-your-own-tenant, same app as `docs/okta-setup.md`
# (1.x track) if you already did that setup — no new Okta app is needed.
# See docs-2.0/03-oidc-okta-2.0.md for what's different about this track's
# redirect URI (offset port 8010, not 8000) and how this repo's live
# verification actually minted a token (Okta's `client_credentials` grant
# against a machine-to-machine app, not the native-app authorization_code
# flow `docs/okta-setup.md` documents for interactive login — see the doc
# for why both exist and when you'd use each).

_defaults:
  kongctl:
    namespace: kong-claude-ai-gateway-2-0

ai_gateways:
- ref: claude-ai-gateway
  name: claude-ai-gateway
  display_name: "Claude AI Gateway (2.0)"
  description: "AI Gateway 2.0 control plane for kong-claude-ai-gateway"
  labels:
    repo: kong-claude-ai-gateway
    track: "2.0"

  identity_providers:
  - ref: okta-oidc
    name: okta-oidc
    display_name: "Okta OIDC"
    type: openid-connect
    config:
      issuer: "{vault://ai-vault/okta-issuer}"
      client_id:
      - "{vault://ai-vault/okta-client-id}"
      client_secret:
      - "{vault://ai-vault/okta-client-secret}"
      cache_tokens_salt: "{vault://ai-vault/oidc-cache-tokens-salt}"
      auth_methods:
      - authorization_code
      - session
      - bearer
      ssl_verify: true

  model_providers:
  - ref: anthropic-direct
    name: anthropic-direct
    display_name: "Anthropic (direct key)"
    type: anthropic
    config:
      auth:
        type: basic
        headers:
        - name: x-api-key
          value: "{vault://ai-vault/anthropic-api-key}"

  - ref: bedrock-claude
    name: bedrock-claude
    display_name: "AWS Bedrock (Claude)"
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai-vault/aws-access-key-id}"
        secret_access_key: "{vault://ai-vault/aws-secret-access-key}"

  models:
  - ref: claude-chat
    type: model
    name: claude-chat
    display_name: "Claude Chat"
    enabled: true
    access:
      identity_providers:
      - okta-oidc
    formats:
    - type: anthropic
    config:
      route:
        paths:
        - /anthropic
      logging:
        payloads: true
    targets:
    - name: claude-sonnet-4-6
      provider: anthropic-direct
      weight: 100
      config:
        type: anthropic
        version: "2023-06-01"
    - name: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      provider: bedrock-claude
      weight: 1
      config:
        type: bedrock
        region: us-east-1
    capabilities:
    - generate
