_format_version: "3.0"
_konnect:
  control_plane_name: ${{ env "DECK_KONNECT_CONTROL_PLANE_NAME" }}
services:
- name: claude-chat
  host: api.anthropic.com
  port: 443
  protocol: https
  read_timeout: 600000
  routes:
  - name: claude-chat-route
    paths:
    - /anthropic
  plugins:
  - name: openid-connect
    config:
      issuer: ${{ env "DECK_OKTA_ISSUER" }}
      client_id:
      - ${{ env "DECK_OKTA_CLIENT_ID" }}
      client_secret:
      - ${{ env "DECK_OKTA_CLIENT_SECRET" }}
      session_secret: ${{ env "DECK_OIDC_SESSION_SECRET" }}
      cache_tokens_salt: ${{ env "DECK_OIDC_CACHE_TOKENS_SALT" }}
      ssl_verify: true
      redis:
        ssl_verify: true
      cluster_cache_redis:
        ssl_verify: true
      redirect_uri:
      - http://localhost:8000/anthropic
      - http://localhost:8000/anthropic/v1/messages
      - http://localhost:8000/anthropic/v1/models
      login_action: redirect
      auth_methods:
      - authorization_code
      - session
      - bearer
  - name: ai-proxy-advanced
    config:
      genai_category: text/generation
      llm_format: anthropic
      response_streaming: allow
      targets:
      - route_type: llm/v1/chat
        weight: 100
        model:
          provider: anthropic
          options:
            anthropic_version: "2023-06-01"
        auth:
          header_name: x-api-key
          header_value: '{vault://anthropic-secrets/anthropic-api-key}'
        logging:
          log_payloads: true
          log_statistics: true
- name: claude-models
  host: api.anthropic.com
  path: /v1/models
  port: 443
  protocol: https
  routes:
  - name: claude-models-route
    paths:
    - /anthropic/v1/models
  plugins:
  - name: openid-connect
    config:
      issuer: ${{ env "DECK_OKTA_ISSUER" }}
      client_id:
      - ${{ env "DECK_OKTA_CLIENT_ID" }}
      client_secret:
      - ${{ env "DECK_OKTA_CLIENT_SECRET" }}
      session_secret: ${{ env "DECK_OIDC_SESSION_SECRET" }}
      cache_tokens_salt: ${{ env "DECK_OIDC_CACHE_TOKENS_SALT" }}
      ssl_verify: true
      redis:
        ssl_verify: true
      cluster_cache_redis:
        ssl_verify: true
      redirect_uri:
      - http://localhost:8000/anthropic
      - http://localhost:8000/anthropic/v1/messages
      - http://localhost:8000/anthropic/v1/models
      login_action: redirect
      auth_methods:
      - authorization_code
      - session
      - bearer
  - name: request-transformer-advanced
    config:
      add:
        headers:
        - '{vault://anthropic-secrets/anthropic-api-key-header}'
