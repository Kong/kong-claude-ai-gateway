_format_version: "3.0"
_konnect:
  control_plane_name: ${{ env "DECK_KONNECT_CONTROL_PLANE_NAME" }}
plugins:
- name: pre-function
  config:
    rewrite:
    - |
        local jwt_parser = require "kong.plugins.jwt.jwt_parser"

        local claim_name = "${{ env "DECK_TEAM_CLAIM_NAME" }}"
        local header_name = "${{ env "DECK_TEAM_HEADER_NAME" }}"

        -- Prevent a client-supplied header from affecting routing
        ngx.req.clear_header(header_name)

        local authorization = kong.request.get_header("authorization")
        if not authorization then
          return
        end

        local token = authorization:match("^[Bb]earer%s+(.+)$")
        if not token then
          return
        end

        local jwt = jwt_parser:new(token)
        if not jwt or not jwt.claims then
          return
        end

        local value = jwt.claims[claim_name]
        if type(value) ~= "string" or value == "" then
          return
        end

        ngx.req.set_header(header_name, value)
consumers:
- username: team-kong-premium
  custom_id: kong-premium
  groups:
  - name: premium-team
- username: team-kong-standard
  custom_id: kong-standard
  groups:
  - name: standard-team
consumer_groups:
- name: premium-team
- name: standard-team
services:
- name: claude-chat
  host: api.anthropic.com
  port: 443
  protocol: https
  read_timeout: 600000
  routes:
  - name: claude-chat-route
    paths:
    - /anthropic
  plugins:
  - name: openid-connect
    config:
      issuer: ${{ env "DECK_OKTA_ISSUER" }}
      client_id:
      - ${{ env "DECK_OKTA_CLIENT_ID" }}
      client_secret:
      - ${{ env "DECK_OKTA_CLIENT_SECRET" }}
      session_secret: ${{ env "DECK_OIDC_SESSION_SECRET" }}
      cache_tokens_salt: ${{ env "DECK_OIDC_CACHE_TOKENS_SALT" }}
      ssl_verify: true
      redis:
        ssl_verify: true
      cluster_cache_redis:
        ssl_verify: true
      redirect_uri:
      - http://localhost:8000/anthropic
      - http://localhost:8000/anthropic/v1/messages
      - http://localhost:8000/anthropic/v1/models
      login_action: redirect
      auth_methods:
      - authorization_code
      - session
      - bearer
      # Maps the same "team" claim used for module 4's model-listing routing
      # to a Kong Consumer, by matching it against each consumer's custom_id
      # below. Optional: a caller with no/unrecognized team claim still
      # authenticates fine, they just won't match a consumer_group policy
      # (so no cost limit applies to them).
      consumer_claims:
      - - ${{ env "DECK_TEAM_CLAIM_NAME" }}
      consumer_by:
      - custom_id
      consumer_optional: true
  - name: ai-proxy-advanced
    config:
      genai_category: text/generation
      llm_format: anthropic
      response_streaming: allow
      targets:
      # Priced targets: model_alias must match the "model" the client sends
      # in the request body. Pricing is illustrative, per Anthropic's public
      # per-model USD/1M-token rates by tier (see docs/05-consumer-rate-limiting.md
      # for sourcing/caveats on the fictional models) — adjust to taste.
      - route_type: llm/v1/chat
        weight: 100
        model:
          provider: anthropic
          model_alias: claude-opus-4-8
          name: claude-opus-4-8
          options:
            anthropic_version: "2023-06-01"
            input_cost: 15
            output_cost: 75
        auth:
          header_name: x-api-key
          header_value: '{vault://anthropic-secrets/anthropic-api-key}'
        logging:
          log_payloads: true
          log_statistics: true
      - route_type: llm/v1/chat
        weight: 100
        model:
          provider: anthropic
          model_alias: claude-sonnet-5
          name: claude-sonnet-5
          options:
            anthropic_version: "2023-06-01"
            input_cost: 3
            output_cost: 15
        auth:
          header_name: x-api-key
          header_value: '{vault://anthropic-secrets/anthropic-api-key}'
        logging:
          log_payloads: true
          log_statistics: true
      - route_type: llm/v1/chat
        weight: 100
        model:
          provider: anthropic
          model_alias: claude-fable-5
          name: claude-fable-5
          options:
            anthropic_version: "2023-06-01"
            input_cost: 1
            output_cost: 5
        auth:
          header_name: x-api-key
          header_value: '{vault://anthropic-secrets/anthropic-api-key}'
        logging:
          log_payloads: true
          log_statistics: true
      - route_type: llm/v1/chat
        weight: 100
        model:
          provider: anthropic
          model_alias: claude-haiku-4-5-20251001
          name: claude-haiku-4-5-20251001
          options:
            anthropic_version: "2023-06-01"
            input_cost: 1
            output_cost: 5
        auth:
          header_name: x-api-key
          header_value: '{vault://anthropic-secrets/anthropic-api-key}'
        logging:
          log_payloads: true
          log_statistics: true
      # Fallback: no model_alias, so any request whose model doesn't match
      # one of the priced targets above still gets proxied dynamically
      # (whatever model the client asked for), just without cost tracking.
      - route_type: llm/v1/chat
        weight: 100
        model:
          provider: anthropic
          options:
            anthropic_version: "2023-06-01"
        auth:
          header_name: x-api-key
          header_value: '{vault://anthropic-secrets/anthropic-api-key}'
        logging:
          log_payloads: true
          log_statistics: true
  - name: ai-rate-limiting-advanced
    config:
      llm_format: anthropic
      policies:
      - match:
        - type: consumer_group
          key: premium-team
        limits:
        - limit: 5
          window_size: 60
          tokens_count_strategy: cost
      - match:
        - type: consumer_group
          key: standard-team
        limits:
        - limit: 0.5
          window_size: 60
          tokens_count_strategy: cost
