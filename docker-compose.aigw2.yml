services:
  kong-dp-2.0:
    image: kong/kong-ai-gateway-dev:2.0.1-rc.1
    container_name: kong-dp-2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONNECT_AIGW2_CP_ENDPOINT}:443
      KONG_CLUSTER_SERVER_NAME: ${KONNECT_AIGW2_CP_ENDPOINT}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONNECT_AIGW2_TELEMETRY_ENDPOINT}:443
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONNECT_AIGW2_TELEMETRY_ENDPOINT}
      KONG_CLUSTER_CERT: /certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      # Admin API baked in via admin.conf (normally absent on a Konnect DP) —
      # needed to confirm compiled route/plugin chains during verification.
      KONG_NGINX_HTTP_INCLUDE: /templates/admin.conf
      KONG_PROXY_LISTEN: "0.0.0.0:8010, 0.0.0.0:8453 ssl"
      KONG_STATUS_LISTEN: "0.0.0.0:8110"
      KONG_LOG_LEVEL: debug
      KONG_ANONYMOUS_REPORTS: "off"
      KONG_PLUGINS: bundled
      KONG_RESOLVER_FAMILY: "A"
    volumes:
      - ${CERTS_DIR_2_0:-./certs-2.0}:/certs:ro
      - ./kong-2.0/admin.conf:/templates/admin.conf:ro
    ports:
      - "8010:8010"
      - "8453:8453"
      - "8110:8110"
      - "8011:8001"
